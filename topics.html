<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A concise AI-only digest synthesized from selected X accounts.">
  <title>Signal — AI digest</title>
  <link rel="stylesheet" href="styles.css?v=20260901-5">
</head>
<body>
  <div class="app-shell">
    <aside class="left-rail" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Signal home"><span class="brand-mark">S</span><span class="brand-name">signal</span></a>
      <nav>
        <a class="nav-item" href="index.html"><span class="nav-symbol">◉</span><span>Latest</span></a>
        <a class="nav-item active" href="topics.html"><span class="nav-symbol">✦</span><span>Topics</span></a>
        <a class="nav-item" href="weekly.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3M8 17h3"/></svg><span>Weekly</span></a>
        <a class="nav-item" href="search.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></a>
      </nav>
    </aside>

    <main class="feed-column" id="top">
      <header class="feed-header"><div><h1>Topics</h1><p id="feedSubtitle">Ideas, releases, workflows, and debates</p></div><span class="curated-pill">Digest</span></header>
      <section id="feed" class="feed" aria-live="polite"><div class="loading-card"><span></span><span></span><span></span></div></section>
    </main>

    <aside class="right-rail">
      <section class="side-card spotlight-card"><span class="eyebrow">This week</span><h2 id="spotlightTitle">Latest weekly digest</h2><p id="spotlightSummary"></p><a class="side-card-link" id="spotlightLink" href="weekly.html">Read the digest →</a></section>
      <section class="side-card"><h2>Latest conversations</h2><a class="side-card-link" href="index.html">Open the live feed →</a></section>
    </aside>
  </div>

  <template id="digestCardTemplate">
    <a class="digest-card" href="#">
      <div class="card-avatar"><span>✦</span></div>
      <div class="card-body">
        <div class="card-meta"><strong>Signal Digest</strong><span class="verified">✓</span><span>@signal</span><span>·</span><time></time></div>
        <span class="eyebrow"></span><h2></h2><p class="card-summary"></p>
        <div class="evidence-strip"><div class="avatar-stack"></div><span class="evidence-copy"></span></div>
        <div class="card-actions"><span><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-4.2-1L3 20l1.2-4A8.3 8.3 0 1 1 21 11.5Z"/></svg><b class="source-total"></b></span><span class="open-label">Open page <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></div>
      </div>
    </a>
  </template>
  <script src="app.js?v=20260901-5" defer></script>
</body>
</html>
