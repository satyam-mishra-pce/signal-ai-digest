<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The latest AI engineering posts, threads, quotes, and media from Signal's tracked accounts.">
  <title>Signal — Latest AI posts</title>
  <link rel="stylesheet" href="styles.css?v=20260901-5">
</head>
<body>
  <div class="app-shell">
    <aside class="left-rail" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Signal home"><span class="brand-mark">S</span><span class="brand-name">signal</span></a>
      <nav>
        <a class="nav-item active" href="index.html"><span class="nav-symbol">◉</span><span>Latest</span></a>
        <a class="nav-item" href="topics.html"><span class="nav-symbol">✦</span><span>Topics</span></a>
        <a class="nav-item" href="weekly.html"><span class="nav-symbol">□</span><span>Weekly</span></a>
        <a class="nav-item" href="search.html"><span class="nav-symbol">⌕</span><span>Search</span></a>
      </nav>
    </aside>

    <main class="feed-column" id="top">
      <header class="feed-header"><div><h1>Latest AI posts</h1><p id="feedSubtitle">What builders are discussing now</p></div><span class="curated-pill" id="updatedAt">Latest</span></header>
      <section class="feed-toolbar" aria-label="Feed filters">
        <select id="topicFilter" aria-label="Filter by topic"><option value="">All topics</option></select>
        <select id="authorFilter" aria-label="Filter by author"><option value="">All authors</option></select>
        <select id="kindFilter" aria-label="Filter by post type"><option value="">All types</option><option value="post">Posts</option><option value="reply">Replies</option><option value="quote">Quotes</option></select>
        <label class="toggle-filter"><input type="checkbox" id="mediaFilter"> Media</label>
        <label class="toggle-filter"><input type="checkbox" id="bookmarkFilter"> Bookmarks</label>
      </section>
      <section id="latestFeed" class="sources-list latest-feed" aria-live="polite"><div class="loading-card"><span></span><span></span><span></span></div></section>
    </main>

    <aside class="right-rail">
      <section class="side-card spotlight-card"><span class="eyebrow">This week</span><h2 id="spotlightTitle">Latest weekly digest</h2><p id="spotlightSummary"></p><a class="side-card-link" id="spotlightLink" href="weekly.html">Read the digest →</a></section>
      <section class="side-card"><h2>Saved posts</h2><button class="secondary-button" id="showBookmarks">Open bookmarks</button></section>
    </aside>
  </div>
  <script src="shared.js?v=20260901-5" defer></script>
  <script src="latest.js?v=20260901-5" defer></script>
</body>
</html>
